name: Python Application CI-CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  test:
    name: Run Unit Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Unit Tests
        run: python -m pytest tests/ -v

  docker:
    name: Build and Push Docker Image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build             -t ${{ secrets.DOCKERHUB_USERNAME }}/devops-demo:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push             ${{ secrets.DOCKERHUB_USERNAME }}/devops-demo:${{ github.sha }}

  completion:
    name: Pipeline Completion
    needs: docker
    if: always() && needs.test.result == 'success' && (needs.docker.result == 'success' || needs.docker.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Verify Pipeline
        run: |
          echo "Build completed successfully"
          echo "Unit tests passed"
          if [ "${{ needs.docker.result }}" = "success" ]; then
            echo "Docker image pushed successfully"
          else
            echo "Docker publishing skipped for pull request"
          fi
